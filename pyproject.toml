[project]
name = "kynetic-agents"
version = "0.5.1"
description = "Multi-agent Discord runtime for hub-and-spoke AI teams — forked from kynetic-agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Miguel Alonso Jr.", email = "miguel@kynetic.ai" }]
maintainers = [{ name = "Miguel Alonso Jr.", email = "miguel@kynetic.ai" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "aiohttp>=3.12.15",
    "apscheduler>=3.11.2",
    "deepagents>=0.4.1",
    "discord-py>=2.6.4",
    "matplotlib>=3.8",
    "mcp>=1.26.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    # mempalace is used for shared cross-agent semantic memory (opt-in via config).
    # TODO: move to optional-dependencies once optional MCP server support is wired up.
    "mempalace",
]

[project.urls]
Homepage = "https://github.com/kynetic-ai/kynetic-agents"

[project.scripts]
kynetic-agents = "kynetic_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "kynetic_agents/**/*.py",
    "kynetic_agents/builtin_skills/**/*.md",
    "kynetic_agents/**/*.md",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
]
